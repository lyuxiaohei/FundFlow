<style>

  svg { display:block; width:100%; height:auto; }
  .footer { margin-top:32px; padding-top:16px; border-top:1px solid var(--rule);

<p class="eyebrow">ATTACHMENT 7 · FIG.2 · PIPELINE FLOW</p>
<h1>图 2 · 投前主流程（① → ⑨）</h1>
<p class="subtitle">接触到基金设立的主链。④ 存在双路径（A 对方直接发资料包 / B 先现场访谈确认跟进后再发）；★①~★④ 为六节点在线审批挂接点（详见图 6）；「老板否决 / 全体不出资 / 投决未通过」等否定分支进入右侧放弃通道——①②④ 阶段的放弃入口见图 1 ● 标记。</p>

<div class="diagram">
<svg viewBox="0 0 760 1320" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fafafa"/>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- ===== 箭头 ===== -->
  <line x1="192" y1="108" x2="192" y2="144" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="192" y1="188" x2="192" y2="228" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="192" y1="272" x2="192" y2="312" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="192" y1="356" x2="192" y2="400" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- 资料策略 diamond：下出 = 路径A，右出 = 路径B -->
  <line x1="192" y1="476" x2="192" y2="512" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="204" y="498" font-size="8" fill="#6b7280" font-family="'Geist Mono',monospace">A 直接资料包</text>
  <path d="M 312 436 H 440 V 508" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="330" y="428" font-size="8" fill="#6b7280" font-family="'Geist Mono',monospace">B 先访谈</text>
  <!-- B 支内部 -->
  <line x1="440" y1="548" x2="440" y2="580" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- B 汇入尽调 -->
  <path d="M 440 620 V 670 H 312" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- 尽调 → 立项 diamond -->
  <line x1="192" y1="692" x2="192" y2="708" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- 立项：下=通过，右=否决 -->
  <line x1="192" y1="780" x2="192" y2="816" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="204" y="800" font-size="8" fill="#6b7280" font-family="'Geist Mono',monospace">通过</text>
  <line x1="312" y1="742" x2="576" y2="742" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="380" y="734" font-size="8" fill="#6b7280" font-family="'Geist Mono',monospace">老板否决</text>
  <!-- 投资人路演 diamond：下=认可，右=不出资 -->
  <line x1="192" y1="888" x2="192" y2="924" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="204" y="908" font-size="8" fill="#6b7280" font-family="'Geist Mono',monospace">认可</text>
  <line x1="312" y1="850" x2="576" y2="850" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="380" y="842" font-size="8" fill="#6b7280" font-family="'Geist Mono',monospace">全体不出资</text>
  <!-- 投决 diamond：下=通过，右=未通过 -->
  <line x1="192" y1="996" x2="192" y2="1028" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="204" y="1016" font-size="8" fill="#6b7280" font-family="'Geist Mono',monospace">通过</text>
  <line x1="312" y1="958" x2="576" y2="958" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="380" y="950" font-size="8" fill="#6b7280" font-family="'Geist Mono',monospace">未通过</text>
  <!-- 出资 → 基金设立 → 终点 -->
  <line x1="192" y1="1076" x2="192" y2="1112" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="192" y1="1160" x2="192" y2="1196" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ===== 主链节点 ===== -->
  <rect x="112" y="64" width="160" height="44" rx="22" fill="rgba(75,85,99,0.10)" stroke="#6b7280" stroke-width="1"/>
  <text x="192" y="90" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">收到 BP</text>

  <rect x="72" y="144" width="240" height="44" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="192" y="163" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">上传 BP · 自动建档</text>
  <text x="192" y="179" font-size="8" fill="#6b7280" text-anchor="middle" font-family="'Geist Mono',monospace">R1 宽口径入库 · BP 包归档</text>

  <rect x="72" y="228" width="240" height="44" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="192" y="247" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">② 线上路演</text>
  <text x="192" y="263" font-size="8" fill="#6b7280" text-anchor="middle" font-family="'Geist Mono',monospace">路演纪要归档</text>

  <rect x="72" y="312" width="240" height="44" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="192" y="331" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">③ 签署保密协议 NDA</text>
  <text x="192" y="347" font-size="8" fill="#6b7280" text-anchor="middle" font-family="'Geist Mono',monospace">此环节无放弃点</text>

  <!-- diamond 资料策略 -->
  <polygon points="192,400 312,438 192,476 72,438" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="192" y="434" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">对方资料策略？</text>
  <text x="192" y="452" font-size="8" fill="#6b7280" text-anchor="middle" font-family="'Geist Mono',monospace">④ 双路径</text>

  <!-- A 支节点 -->
  <rect x="72" y="512" width="240" height="36" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="192" y="534" font-size="11" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">路径 A · 对方直接发尽调资料包</text>

  <!-- B 支节点 -->
  <rect x="352" y="508" width="176" height="40" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="440" y="526" font-size="11" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">路径 B · 现场访谈</text>
  <text x="440" y="541" font-size="8" fill="#6b7280" text-anchor="middle" font-family="'Geist Mono',monospace">确认跟进后再发资料包</text>
  <rect x="352" y="580" width="176" height="40" rx="6" fill="rgba(17,24,39,0.05)" stroke="#4b5563" stroke-width="1"/>
  <text x="440" y="598" font-size="11" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">尽调资料包</text>
  <text x="440" y="613" font-size="8" fill="#6b7280" text-anchor="middle" font-family="'Geist Mono',monospace">逻辑包强制分类</text>

  <!-- 尽调启动 -->
  <rect x="72" y="648" width="240" height="44" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="192" y="667" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">④ 尽调启动</text>
  <text x="192" y="683" font-size="8" fill="#6b7280" text-anchor="middle" font-family="'Geist Mono',monospace">尽调资料包归档（六类之一）</text>

  <!-- diamond 立项 -->
  <polygon points="192,708 312,746 192,784 72,746" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="192" y="742" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">⑤ 立项会</text>
  <text x="192" y="760" font-size="8" fill="#2563eb" text-anchor="middle" font-family="'Geist Mono',monospace">★① 立项审批</text>

  <!-- diamond 投资人路演 -->
  <polygon points="192,816 312,854 192,892 72,854" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="192" y="850" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">⑥ 投资人路演</text>
  <text x="192" y="868" font-size="8" fill="#6b7280" text-anchor="middle" font-family="'Geist Mono',monospace">08-26 新增节点</text>

  <!-- diamond 投决 -->
  <polygon points="192,924 312,962 192,1000 72,962" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="192" y="958" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">⑦ 投决会</text>
  <text x="192" y="976" font-size="8" fill="#2563eb" text-anchor="middle" font-family="'Geist Mono',monospace">★② 投决审批</text>

  <!-- 出资 -->
  <rect x="72" y="1028" width="240" height="48" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="192" y="1048" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">⑧ 出资（分水岭）</text>
  <text x="192" y="1066" font-size="8" fill="#2563eb" text-anchor="middle" font-family="'Geist Mono',monospace">★④ 付款指令审批</text>

  <!-- 基金设立 -->
  <rect x="72" y="1112" width="240" height="48" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="192" y="1132" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">⑨ 基金设立</text>
  <text x="192" y="1150" font-size="8" fill="#6b7280" text-anchor="middle" font-family="'Geist Mono',monospace">★③ 注册审批 · LP 资格认定 · Q7 1:1</text>

  <!-- 终点 oval -->
  <rect x="100" y="1196" width="184" height="44" rx="22" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.2"/>
  <text x="192" y="1222" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">进入 ⑩ 投后管理</text>

  <!-- ===== 放弃通道容器 ===== -->
  <rect x="576" y="700" width="152" height="308" rx="8" fill="rgba(17,24,39,0.02)" stroke="#111827" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="652" y="728" font-size="10" font-weight="600" fill="#111827" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">放弃通道</text>
  <text x="652" y="756" font-size="9" fill="#4b5563" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">放弃登记</text>
  <text x="652" y="774" font-size="9" fill="#4b5563" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">原因必填（预置+自定义）</text>
  <line x1="620" y1="792" x2="684" y2="792" stroke="#4b5563" stroke-width="1" marker-end="url(#arr)"/>
  <text x="652" y="820" font-size="9" fill="#4b5563" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">未投归档</text>
  <text x="652" y="838" font-size="9" fill="#4b5563" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">不可回流 · 可检索统计</text>
  <text x="652" y="872" font-size="8" fill="#9ca3af" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">①②④ 阶段放弃入口</text>
  <text x="652" y="888" font-size="8" fill="#9ca3af" text-anchor="middle" font-family="'Geist','PingFang SC',sans-serif">见图 1 ● 标记</text>

  <!-- ===== Legend ===== -->
  <line x1="32" y1="1264" x2="728" y2="1264" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>
  <text x="32" y="1286" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.14em" fill="#4b5563">LEGEND</text>
  <rect x="104" y="1276" width="16" height="12" rx="3" fill="#ffffff" stroke="#111827" stroke-width="1"/>

  <polygon points="204,1270 222,1282 204,1294 186,1282" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="230" y="1286" font-family="'Geist Mono',monospace" font-size="9" fill="#4b5563">决策（否 → 放弃通道）</text>
  <text x="400" y="1286" font-family="'Geist Mono',monospace" font-size="9" fill="#2563eb">★n = 六节点审批挂接</text>
  <text x="560" y="1286" font-family="'Geist Mono',monospace" font-size="9" fill="#4b5563">虚线框 = 放弃通道</text>
</svg>
</div>
